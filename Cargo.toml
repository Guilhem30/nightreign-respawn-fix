[package]
name = "respawn-gate-fix"
description = "Elden Ring Nightreign: no more long black screen after dying when the respawn point has a different weather"
version = "0.3.1-beta"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "respawn_gate_fix"
crate-type = ["cdylib"]

[features]
# Test-only ini keys (banner_test, test_skip_fix) for the dev harness. Never
# in release builds.
dev = []

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[dependencies]
# Finds the game's FD4 singletons (CSEventMan, CSWorldGeomMan, ...) by name.
from-singleton = "3.0.1"
pelite = "0.10"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
]

[profile.release]
# Keep line info in the .pdb so crash reports can be read.
debug = 1
# Smaller DLL: the fix is not performance-critical (a 10 ms poll loop and a
# once-per-frame hook that returns at once), so optimize for size, with one
# codegen unit and whole-program LTO. Safety does not depend on these flags:
# `panic = "unwind"` below must stay, and the host tests also run with
# `cargo test --release` against this profile.
opt-level = "s"
lto = "fat"
codegen-units = 1
# Unwind (not abort): a panic stays inside our own thread, which then stops
# and restores the game's code, instead of closing the game. The only code of
# ours on a game thread (the HUD hook in banner/hook.rs) catches panics itself, so
# a panic can never unwind into the game's code.
panic = "unwind"
